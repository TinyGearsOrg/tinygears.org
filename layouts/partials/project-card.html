<a class="card" href="{{ .RelPermalink }}"{{ with .Params.accent }} style="--card-accent: {{ . }}"{{ end }}>
  {{ partial "logo.html" . }}
  <div class="text">
    <h3>{{ .Title }}</h3>
    <p>{{ .Params.summary }}</p>
    <p class="meta">{{ .Params.status }}{{ with .Params.version }} &middot; {{ . }}{{ end }}</p>
  </div>
</a>
