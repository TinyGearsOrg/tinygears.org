<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  <header class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">TinyGears</a>
    <nav>
      <a href="{{ "/projects/" | relURL }}">Projects</a>
      <a href="{{ "/about/" | relURL }}">About</a>
      <a href="{{ site.Params.github }}">GitHub</a>
    </nav>
  </header>
  <main class="wrap">{{ block "main" . }}{{ end }}</main>
  <footer class="wrap">Apache License 2.0 &middot; <a href="{{ site.Params.github }}">TinyGearsOrg on GitHub</a></footer>
</body>
</html>
