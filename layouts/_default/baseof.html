<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <header class="app">
    <div class="container">
      <a class="brand" href="{{ "/" | relURL }}">{{ partial "logo.html" . }}<span>TinyGears</span></a>
      <nav aria-label="Site links">
        <a href="{{ "/projects/" | relURL }}">Projects</a>
        <a href="{{ "/about/" | relURL }}">About</a>
        <a href="{{ site.Params.github }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="container">{{ block "main" . }}{{ end }}</main>
  <footer class="container">Apache License 2.0 &middot; <a href="{{ site.Params.github }}">TinyGearsOrg on GitHub</a></footer>
</body>
</html>
